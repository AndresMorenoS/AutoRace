<!DOCTYPE html>
<html>
<head>
    <title>Click Race Game</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/webjars/jquery/3.1.1-1/jquery.min.js"></script>
    <script src="/webjars/sockjs-client/1.0.2/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/2.3.3/stomp.min.js"></script>
    <script src="/js/app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Click Race Game - Race #25</h1>
        
        <div id="registration-section">
            <div class="form-group">
                <label for="player-number">Enter your car number:</label>
                <input type="number" id="player-number" min="1" max="999" />
                <button id="register-btn">Register</button>
            </div>
            <p id="status-message" class="status-message"></p>
        </div>
        
        <div id="game-section" style="display: none;">
            <div class="game-info">
                <p>Your car: <span id="my-car-number"></span></p>
                <p>Participants: <span id="participant-count">0</span> / 5</p>
                <p id="winner-message" class="winner-message"></p>
            </div>
            
            <button id="move-btn" disabled>MOVE MY CAR!</button>
            
            <div id="race-track">
                <div id="finish-line"></div>
            </div>
        </div>
    </div>
</body>
</html>
